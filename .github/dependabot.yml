# Veille de dépendances : des PR groupées pour npm et les actions GitHub. Elle
# ne bloque jamais la CI — préférée à `npm audit`, qui échoue de façon
# intempestive sur des avis transitifs sans rapport.
#
# POURQUOI CE FICHIER REVIENT. Il avait été retiré le 18/07/2026 comme
# « doublon de renovate ». Renovate est bien configuré — `renovate.json` étend
# le préréglage du socle — mais il n'a jamais ouvert une seule PR ici : les
# 20 PR de robot de ce dépôt sont TOUTES de Dependabot. Le doublon n'en était
# pas un, et la veille est restée à l'arrêt deux mois.
#
# LE REGISTRE EST LA CORRECTION. La version précédente n'en déclarait aucun, et
# chaque exécution finissait en `private_source_authentication_failure` sur
# `@mister-guiiug/dev-wpa-config` — le socle, sous le nom qu'il portait avant
# d'être renommé. `npm.pkg.github.com` exige un jeton, même pour un paquet
# public : sans lui, Dependabot ouvrait bien ses autres PR mais sortait rouge à
# tous les coups.
#
# LE SECRET EST POSÉ depuis le 15/09/2026 : `DEPENDABOT_PACKAGES_TOKEN`, dans
# l'onglet DEPENDABOT du dépôt — pas Actions. Les deux réserves sont distinctes,
# et un secret Actions du même nom resterait invisible d'ici : le premier
# passage, avant qu'il existe, s'est arrêté sur `422 Secret Not Found` sans rien
# ouvrir. C'est un PAT classique au seul scope `read:packages` ; le paquet du
# socle est public sur GitHub Packages, aucun droit sur les dépôts n'est
# nécessaire. S'il expire, ce job redeviendra rouge sans autre avertissement que
# son propre journal.
#
# Les règles reprennent le préréglage Renovate du socle, pour que les deux
# outils disent la même chose si Renovate est un jour installé : le socle seul
# dans sa PR, le reste groupé en mineur + patch, les actions groupées.
version: 2

registries:
  socle-github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - socle-github-packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Le socle est EXCLU du groupe, donc il arrive dans sa propre PR — comme
      # chez Renovate. C'est lui qui entraîne le parc entier : sa montée doit
      # se lire seule, sans être noyée dans dix autres lignes de lockfile.
      minor-and-patch:
        exclude-patterns:
          - '@mister-guiiug/dev-pwa-config'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
