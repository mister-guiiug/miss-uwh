# Anti-pause Supabase Free — caller planifié.
#
# Un projet Free se met en pause après sept jours sans requête, et le
# déploiement échoue alors sur « project is paused » (miss-carbook, 29/08/2026).
# Ce ping fait un SELECT anonyme sur la table `keep_alive` chaque jour.
#
# Requiert les secrets VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY, et la table
# `keep_alive` (migration 0017_keep_alive.sql).
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 4 * * *' # chaque jour : tous les 3 jours n'a pas empêché la pause (miss-uwh, 13/10/2026)
  workflow_dispatch:

# Le ping ne lit rien du dépôt : lecture seule, rien de plus.
permissions:
  contents: read

jobs:
  keepalive:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-keepalive.yml@v6
    # Nommés, pas hérités : le workflow déclare exactement ces deux secrets.
    # `inherit` lui donnerait accès à tout le trousseau du dépôt.
    secrets:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
