<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Miss UWH">
  <!--
    LE MASKABLE, ET POURQUOI CE N'EST PAS `icon.svg` EN PLUS PETIT.

    `scripts/generate-pwa-icons.mjs` le fabriquait en réduisant l'icône ENTIÈRE
    à 80 % sur un aplat `#1758ba` — le bleu du bas du dégradé. La tuile arrondie
    se retrouvait donc posée au milieu d'un bleu plus sombre, et le raccord se
    voyait : mesuré, le coin rendait rgb(23,88,186) quand l'intérieur rendait
    rgb(55,119,213). Android ne cache pas ce bord, il le révèle.

    DEUX DIFFÉRENCES AVEC LA SOURCE, ET DEUX SEULEMENT :

      1. LE FOND N'A PLUS DE COINS. `rx="112"` disparaît : le dégradé occupe la
         toile entière, donc il n'y a plus de bord à raccorder. C'est le MÊME
         dégradé, aux mêmes arrêts.

      2. LE DESSIN RENTRE DANS LA ZONE DE SÉCURITÉ, le disque de 80 % de la
         toile. Mesuré sur le rendu : recentré — il penchait vers la gauche à
         cause des vagues — il atteignait 217,7 px pour une limite à 204,8. À
         88 % il tombe à 192 px.
  -->
  <defs>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f74d9" />
      <stop offset="1" stop-color="#1758ba" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#aqua)" />
  <g transform="translate(256 256) scale(0.88) translate(-256 -256) translate(24 -9)">
    <!-- vagues -->
    <g fill="none" stroke="#9dc0f5" stroke-width="14" stroke-linecap="round" opacity="0.6">
      <path d="M64 150 q40 -34 80 0 t80 0 t80 0 t80 0" />
      <path d="M64 392 q40 -34 80 0 t80 0 t80 0 t80 0" />
    </g>
    <!-- crosse de hockey sub -->
    <path d="M196 132 l40 0 l0 150 q0 70 70 70 l24 0"
          fill="none" stroke="#ffffff" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round" />
    <!-- palet (doré, écho au logo du club) -->
    <ellipse cx="350" cy="356" rx="58" ry="30" fill="#caa400" />
    <ellipse cx="350" cy="346" rx="58" ry="30" fill="#edc715" />
  </g>
</svg>
